[project]
name = "pandapulse-backend"
version = "1.0.0"
description = "PandaPulse AI Neural Engine Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "orjson>=3.9.15",
    "sse-starlette>=2.0.0",
    "chromadb>=0.4.24",
    "langchain>=0.1.13",
    "langchain-community>=0.0.29",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "B008", "BLE001", "UP006", "UP035", "UP045"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
