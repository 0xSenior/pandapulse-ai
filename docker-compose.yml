version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pandapulse-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=llama3:8b
      - EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - DOCS_DIRECTORY=/app/data/pandas_docs
      - CACHE_CAPACITY=256
      - CACHE_ENABLED=true
    volumes:
      - ./backend/data/pandas_docs:/app/data/pandas_docs
      - chroma_data:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pandapulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
